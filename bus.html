<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#09090b">
    <title>巴士到站時間預報</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap');
        
        body {
            font-family: 'Noto Sans HK', system-ui, -apple-system, sans-serif;
            background-color: #09090b; /* OLED 純黑背景，適合手機省電及高對比 */
            color: #f4f4f5;
            -webkit-tap-highlight-color: transparent;
        }

        .font-mono-num {
            font-family: 'Roboto Mono', monospace;
        }

        /* 模擬 LED 螢光效果 */
        .led-yellow {
            color: #facc15;
            text-shadow: 0 0 12px rgba(250, 204, 21, 0.25);
        }

        .led-orange {
            color: #fb923c;
            text-shadow: 0 0 12px rgba(251, 146, 60, 0.3);
        }

        .led-red {
            color: #f87171;
            text-shadow: 0 0 12px rgba(248, 113, 113, 0.4);
        }

        /* 頂部進度條動畫 */
        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        
        .progress-bar-active {
            animation: progress 30s linear infinite;
        }

        /* 快閃動畫 */
        .animate-pulse-fast {
            animation: pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        /* 按鈕點擊反饋 */
        .active-scale {
            transition: transform 0.1s ease;
        }
        .active-scale:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-orange-500 selection:text-white pb-safe">

    <div class="fixed top-0 left-0 right-0 h-1 bg-zinc-900 z-50">
        <div id="refresh-progress" class="h-full bg-orange-500 progress-bar-active"></div>
    </div>

    <header class="sticky top-0 z-40 bg-zinc-950/90 backdrop-blur-md border-b border-zinc-800/80 px-4 py-3 pt-4">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="relative flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                </span>
                <span class="text-xs font-bold tracking-wider text-emerald-400 font-mono-num">LIVE</span>
            </div>

            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2 text-xs font-mono-num bg-zinc-900/80 px-2.5 py-1 rounded-lg border border-zinc-800/60">
                    <span id="current-date" class="text-zinc-400 font-medium">----/--/--</span>
                    <span id="current-time" class="font-bold text-zinc-100 tracking-tight">--:--</span>
                </div>

                <button id="refresh-btn" onclick="fetchBusData()" class="p-2 bg-zinc-900 hover:bg-zinc-800 active-scale border border-zinc-800 rounded-xl text-zinc-300 focus:outline-none" aria-label="刷新數據">
                    <svg id="refresh-icon" class="w-4 h-4 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 px-4 py-4 max-w-md mx-auto w-full">
        <div class="flex items-center justify-between mb-3 px-1">
            <span class="text-xs font-bold text-zinc-400 uppercase tracking-wider">即時到站預報</span>
            <span id="last-update-time" class="text-[11px] text-zinc-400 font-mono-num">更新於 --:--:--</span>
        </div>

        <div id="eta-container" class="space-y-3.5">
            <div class="flex flex-col items-center justify-center py-16 bg-zinc-900/40 border border-zinc-800/80 rounded-2xl">
                <svg class="animate-spin h-8 w-8 text-orange-500 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="text-sm font-medium text-zinc-400">正在獲取最新到站時間...</p>
            </div>
        </div>
    </main>

    <footer class="py-4 px-4 text-center border-t border-zinc-900 bg-zinc-950/60 mt-auto">
        <p class="text-[11px] text-zinc-400 leading-relaxed">
            每 30 秒自動更新 • 數據源自香港政府開放數據 API
        </p>
    </footer>

    <script>
        // ---------------------------------------------------------
        // 1. 即時時鐘與日期更新 (單行顯示)
        // ---------------------------------------------------------
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            const dateElem = document.getElementById('current-date');
            const timeElem = document.getElementById('current-time');

            if (dateElem) dateElem.innerText = `${year}/${month}/${date}`;
            if (timeElem) timeElem.innerHTML = `${hours}<span class="animate-pulse-fast">:</span>${minutes}`;
        }

        updateClock();
        setInterval(updateClock, 1000);

        // ---------------------------------------------------------
        // 2. 手機版路線卡片 HTML 生成器 (包含巴士公司標籤)
        // ---------------------------------------------------------
        function generateRouteHTML(routeData) {
            const { route, destination, etas, company } = routeData;
            
            // 巴士公司徽章樣式 (城巴黃色系 / 九巴紅色系)
            let companyTagHtml = '';
            if (company === '城巴') {
                companyTagHtml = `<span class="px-1.5 py-0.5 text-[10px] font-extrabold rounded bg-amber-400/20 text-amber-300 border border-amber-400/40 shrink-0">城巴</span>`;
            } else if (company === '九巴') {
                companyTagHtml = `<span class="px-1.5 py-0.5 text-[10px] font-extrabold rounded bg-red-500/20 text-red-400 border border-red-500/40 shrink-0">九巴</span>`;
            } else if (company) {
                companyTagHtml = `<span class="px-1.5 py-0.5 text-[10px] font-extrabold rounded bg-zinc-800 text-zinc-300 border border-zinc-700 shrink-0">${company}</span>`;
            }

            // 下一班車 ETA 顯示邏輯
            let nextEtaHtml = '';
            const nextEta = etas[0];
            
            if (nextEta === undefined || nextEta === null || nextEta === "") {
                nextEtaHtml = `<span class="text-xl font-bold text-zinc-500">暫無班次</span>`;
            } else if (nextEta <= 1) {
                nextEtaHtml = `
                    <div class="flex items-baseline gap-1">
                        <span class="text-2xl font-black led-red animate-pulse-fast">即將抵達</span>
                    </div>`;
            } else {
                nextEtaHtml = `
                    <div class="flex items-baseline gap-1">
                        <span class="text-4xl font-black led-orange font-mono-num tracking-tight">${nextEta}</span>
                        <span class="text-xs font-bold text-zinc-400 uppercase">min</span>
                    </div>`;
            }

            // 後續班次 (Pill 膠囊風格，極適合手機閱讀)
            let subsequentEtasHtml = '';
            if (etas.length > 1) {
                const ordinals = ['2nd', '3rd', '4th'];
                const subEtasPills = etas.slice(1).map((eta, idx) => {
                    if (eta === null || eta === undefined) return '';
                    const label = ordinals[idx] || `${idx + 2}th`;
                    const isSecondBus = idx === 0;

                    return `
                        <div class="flex items-center gap-1.5">
                            ${idx > 0 ? `
                                <svg class="w-3 h-3 text-zinc-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>
                                </svg>
                            ` : ''}
                            <span class="inline-flex items-center px-2.5 py-1 rounded-lg ${isSecondBus ? 'bg-amber-400/10 border-amber-400/30' : 'bg-zinc-800/80 border-zinc-700/50'} border text-xs font-mono-num">
                                <span class="text-[10px] font-extrabold ${isSecondBus ? 'text-amber-400' : 'text-zinc-400'} mr-1.5 font-sans">${label}</span>
                                <strong class="${isSecondBus ? 'text-amber-300' : 'text-zinc-200'} font-bold">${eta}</strong><span class="text-[10px] text-zinc-400 ml-1 font-sans">min</span>
                            </span>
                        </div>
                    `;
                }).join('');

                subsequentEtasHtml = `
                    <div class="mt-3 pt-3 border-t border-zinc-800/60 flex items-center justify-between">
                        <span class="text-[11px] font-medium text-zinc-400">隨後班次</span>
                        <div class="flex items-center gap-1.5 overflow-x-auto">
                            ${subEtasPills}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="bg-zinc-900/90 border border-zinc-800/90 rounded-2xl p-4 shadow-xl relative overflow-hidden transition-all active:border-zinc-700">
                    <div class="flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="px-3 py-1.5 bg-amber-400/10 border border-amber-400/30 rounded-xl flex items-center justify-center shrink-0">
                                <span class="text-2xl font-black led-yellow font-mono-num italic tracking-tighter">${route}</span>
                            </div>
                            <div class="flex flex-col min-w-0">
                                <div class="flex items-center gap-1.5 mb-0.5">
                                    ${companyTagHtml}
                                    <span class="text-[10px] font-bold text-zinc-400 tracking-wider"></span>
                                </div>
                                <h2 class="text-lg font-bold text-white truncate tracking-wide leading-tight">${destination}</h2>
                            </div>
                        </div>

                        <div class="text-right shrink-0">
                            ${nextEtaHtml}
                        </div>
                    </div>

                    ${subsequentEtasHtml}
                </div>
            `;
        }

        // ---------------------------------------------------------
        // 3. API 數據獲取邏輯 (加入自訂目的地 customDest)
        // ---------------------------------------------------------
        const routeConfigs = [
            {
                url: 'https://rt.data.gov.hk/v1/transport/citybus-nwfb/eta/CTB/002758/970',
                customDest: '郵局'
            },
            {
                url: 'https://rt.data.gov.hk/v1/transport/citybus-nwfb/eta/CTB/001068/905',
                customDest: '日本城'
            },
            {
                url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/A72EB7FC6BB34E40/905/1',
                customDest: '日本城'
            }
			//,
			//{
            //    url: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/062FFE8F1560E8A4/N271/1',
            //    customDest: '郵局日本城'
            //}
        ];

        async function fetchSingleApi(config) {
            const { url, customDest } = config;
            try {
                const response = await fetch(url);
                if (!response.ok) return null;
                const json = await response.json();
                
                if (!json.data || json.data.length === 0) return null;

                // 依 eta_seq 排序
                const sortedData = json.data
                    .filter(item => item.eta)
                    .sort((a, b) => a.eta_seq - b.eta_seq);

                if (sortedData.length === 0) return null;

                const route = sortedData[0].route;
                
                // 優先使用自訂文字 customDest，如果沒有設定才使用 API 原本的 dest_tc
                const destination = customDest || sortedData[0].dest_tc;
                
                const now = new Date();

                // 根據 URL 判斷巴士公司
                let company = '';
                const lowerUrl = url.toLowerCase();
                if (lowerUrl.includes('citybus')) {
                    company = '城巴';
                } else if (lowerUrl.includes('kmb')) {
                    company = '九巴';
                }

                // 計算剩餘分鐘數
                const etas = sortedData.map(item => {
                    const etaTime = new Date(item.eta);
                    const diffMins = Math.floor((etaTime - now) / (1000 * 60));
                    return diffMins < 0 ? 0 : diffMins;
                });

                return { route, destination, etas, company };
            } catch (err) {
                console.error(`獲取 API 數據失敗 (${url}):`, err);
                return null;
            }
        }

        async function fetchBusData() {
            // 觸發刷新圖示旋轉效果
            const refreshIcon = document.getElementById('refresh-icon');
            if (refreshIcon) refreshIcon.classList.add('rotate-180');

            try {
                const results = await Promise.all(routeConfigs.map(fetchSingleApi));
                const busDataList = results.filter(item => item !== null);

                // 根據第一班車的到站剩餘時間 (etas[0]) 由小至大排序 (最快到的排最上)
                busDataList.sort((a, b) => {
                    const etaA = (a.etas && a.etas.length > 0 && a.etas[0] !== null && a.etas[0] !== undefined) ? a.etas[0] : Infinity;
                    const etaB = (b.etas && b.etas.length > 0 && b.etas[0] !== null && b.etas[0] !== undefined) ? b.etas[0] : Infinity;
                    return etaA - etaB;
                });

                const container = document.getElementById('eta-container');

                if (busDataList.length === 0) {
                    container.innerHTML = `
                        <div class="p-6 bg-zinc-900/60 border border-zinc-800 rounded-2xl text-center text-zinc-400">
                            <p class="text-sm font-medium">目前暫無即將到達的班次數據</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = busDataList.map(generateRouteHTML).join('');
                }

                // 更新最後刷新時間
                const now = new Date();
                const timeString = now.toTimeString().split(' ')[0];
                document.getElementById('last-update-time').innerText = `更新於 ${timeString}`;

                // 重置頂部進度條
                const progressBar = document.getElementById('refresh-progress');
                progressBar.classList.remove('progress-bar-active');
                void progressBar.offsetWidth; // 觸發 reflow
                progressBar.classList.add('progress-bar-active');

            } catch (error) {
                console.error("獲取巴士數據失敗:", error);
                document.getElementById('eta-container').innerHTML = `
                    <div class="p-5 bg-red-950/30 border border-red-500/40 rounded-2xl text-center">
                        <p class="text-red-400 text-sm font-bold">無法獲取數據</p>
                        <p class="text-zinc-500 mt-1 text-xs">請檢查網絡連線或稍後再試</p>
                    </div>
                `;
            } finally {
                setTimeout(() => {
                    if (refreshIcon) refreshIcon.classList.remove('rotate-180');
                }, 500);
            }
        }

        // ---------------------------------------------------------
        // 4. 自動定時器 (30秒)
        // ---------------------------------------------------------
        fetchBusData();
        setInterval(fetchBusData, 30000);

    </script>
</body>
</html>
