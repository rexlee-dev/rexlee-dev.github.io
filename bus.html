<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能巴士到站時間顯示屏</title>
    <!-- 引入 Tailwind CSS 以進行快速及美觀的樣式設計 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans HK', sans-serif;
            background-color: #050505; /* 極深色背景模擬LED屏幕 */
            color: #ffffff;
        }

        /* 隱藏捲軸但保持可捲動 */
        ::-webkit-scrollbar {
            display: none;
        }
        
        .led-text-orange {
            color: #ff9800;
            text-shadow: 0 0 10px rgba(255, 152, 0, 0.3);
        }
        
        .led-text-yellow {
            color: #ffeb3b;
            text-shadow: 0 0 10px rgba(255, 235, 59, 0.3);
        }

        .led-text-red {
            color: #f44336;
            text-shadow: 0 0 10px rgba(244, 67, 54, 0.3);
        }

        /* 更新進度條動畫 */
        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        
        .progress-bar {
            animation: progress 30s linear infinite;
        }

        /* 脈搏閃爍效果 (用於時鐘冒號或即將抵達提示) */
        .animate-pulse-fast {
            animation: pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-hidden">

    <!-- 頂部進度條 (顯示30秒更新週期) -->
    <div class="h-1 w-full bg-zinc-800">
        <div id="refresh-progress" class="h-full bg-orange-500 progress-bar"></div>
    </div>

    <!-- 頂部精簡時鐘列 -->
    <header class="flex justify-between items-center px-6 py-2 border-b border-zinc-800 bg-zinc-950">
        <div class="flex items-center gap-2">
            <div class="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse"></div>
            <span class="text-xs text-zinc-500 font-mono">LIVE</span>
        </div>
        <div class="flex items-baseline gap-3 text-right">
            <div id="current-date" class="text-xs text-zinc-400">
                ----年--月--日
            </div>
            <div id="current-time" class="text-xl font-bold font-mono tracking-wider text-zinc-200">
                --<span class="animate-pulse-fast">:</span>--
            </div>
        </div>
    </header>

    <main class="flex-1 p-6 flex flex-col gap-4 max-w-7xl mx-auto w-full">
        <!-- 列表表頭 -->
        <div class="grid grid-cols-12 gap-6 px-6 py-2 text-zinc-400 font-bold text-lg border-b-2 border-zinc-800">
            <div class="col-span-2">路線</div>
            <div class="col-span-5">目的地</div>
            <div class="col-span-5 text-right">預計時間</div>
        </div>

        <!-- 巴士數據將會透過 JavaScript 注入到這裡 -->
        <div id="eta-container" class="flex flex-col gap-4">
            <!-- 載入中佔位符 -->
            <div class="flex justify-center items-center py-20 text-zinc-500">
                <svg class="animate-spin -ml-1 mr-3 h-8 w-8 text-orange-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                正在載入數據 Loading Data...
            </div>
        </div>
    </main>

    <footer class="bg-zinc-950 p-4 text-center border-t border-zinc-800 text-zinc-500 text-sm">
        <p>系統每 30 秒自動更新數據。實際到站時間受路況影響，僅供參考。</p>
        <p id="last-update-text" class="mt-1 text-zinc-600">最後更新: --:--:--</p>
    </footer>

    <script>
        // ---------------------------------------------------------
        // 1. 即時時鐘更新系統
        // ---------------------------------------------------------
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            const dateElem = document.getElementById('current-date');
            const timeElem = document.getElementById('current-time');

            if (dateElem) {
                dateElem.innerText = `${year}年${month}月${date}日`;
            }
            if (timeElem) {
                timeElem.innerHTML = `${hours}<span class="animate-pulse-fast">:</span>${minutes}`;
            }
        }

        // 初始化時鐘並每秒更新一次
        updateClock();
        setInterval(updateClock, 1000);

        // ---------------------------------------------------------
        // 2. 數據獲取與渲染系統 (實時 API 串接)
        // ---------------------------------------------------------
        
        // 生成單個路線的 HTML
        function generateRouteHTML(routeData) {
            const { route, destination, etas } = routeData;
            
            // 處理第一班車 (最重要，放大顯示)
            let nextEtaHtml = '';
            const nextEta = etas[0];
            
            if (nextEta === undefined || nextEta === null || nextEta === "") {
                nextEtaHtml = `<span class="text-3xl text-zinc-600 font-bold">暫無班次</span>`;
            } else if (nextEta <= 1) {
                nextEtaHtml = `<span class="text-4xl led-text-red font-black animate-pulse-fast">即將抵達</span>`;
            } else {
                nextEtaHtml = `<span class="text-6xl led-text-orange font-black font-mono tracking-tighter">${nextEta}</span> 
                               <span class="text-xl text-zinc-400 font-medium ml-1">min</span>`;
            }

            // 處理後續班次 (較小字體)
            let subsequentEtasHtml = '';
            if (etas.length > 1) {
                const subEtas = etas.slice(1).map(eta => {
                    if (eta === "null" || eta === null || eta === undefined) return "-";
                    return `${eta} min`;
                }).join(' , ');
                
                subsequentEtasHtml = `<div class="text-zinc-400 text-base mt-2 flex justify-end items-center gap-2">
                                        <span class="bg-zinc-800 px-2 py-1 rounded text-sm">Next</span> 
                                        <span class="font-mono text-zinc-300">${subEtas}</span>
                                      </div>`;
            }

            // 返回此列的完整 HTML 結構
            return `
                <div class="grid grid-cols-12 gap-6 items-center px-6 py-5 bg-zinc-900 rounded-2xl shadow-lg border border-zinc-800 hover:border-zinc-700 transition-colors">
                    <!-- 1. 路線號碼 -->
                    <div class="col-span-2 flex items-center">
                        <span class="text-5xl font-black led-text-yellow font-mono italic tracking-tighter">${route}</span>
                    </div>
                    
                    <!-- 2. 目的地 -->
                    <div class="col-span-5 flex flex-col justify-center">
                        <span class="text-sm text-zinc-500 uppercase tracking-widest mb-1">往</span>
                        <span class="text-3xl font-bold text-white tracking-wide">${destination}</span>
                    </div>
                    
                    <!-- 3 & 4. 預計時間 (下一班及後續) -->
                    <div class="col-span-5 flex flex-col items-end justify-center">
                        <div class="flex items-baseline justify-end w-full">
                            ${nextEtaHtml}
                        </div>
                        ${subsequentEtasHtml}
                    </div>
                </div>
            `;
        }

        // API URL 列表 (日後有新路線時，只需在這裡新增 URL 即可)
        const apiUrls = [
            'https://rt.data.gov.hk/v1/transport/citybus-nwfb/eta/CTB/002758/970',
			'https://data.etabus.gov.hk/v1/transport/kmb/eta/A72EB7FC6BB34E40/905/1'
        ];

        // 處理單一 API 請求並解析資料
        async function fetchSingleApi(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) return null;
                const json = await response.json();
                
                if (!json.data || json.data.length === 0) return null;

                // 按 eta_seq 排序，數字愈小愈先到站
                const sortedData = json.data
                    .filter(item => item.eta) // 過濾未有預計到站時間的數據
                    .sort((a, b) => a.eta_seq - b.eta_seq);

                if (sortedData.length === 0) return null;

                const route = sortedData[0].route;
                const destination = sortedData[0].dest_tc;
                const now = new Date();

                // 根據 eta 時間與當前時間相減，算出剩餘分鐘數
                const etas = sortedData.map(item => {
                    const etaTime = new Date(item.eta);
                    const diffMins = Math.floor((etaTime - now) / (1000 * 60));
                    return diffMins < 0 ? 0 : diffMins;
                });

                return { route, destination, etas };
            } catch (err) {
                console.error(`獲取 API 數據失敗 (${url}):`, err);
                return null;
            }
        }

        // 核心獲取數據函數
        async function fetchBusData() {
            try {
                // 並發請求所有 API URL
                const results = await Promise.all(apiUrls.map(fetchSingleApi));
                const busDataList = results.filter(item => item !== null);

                const container = document.getElementById('eta-container');

                if (busDataList.length === 0) {
                    container.innerHTML = `
                        <div class="p-8 bg-zinc-900 border border-zinc-800 rounded-2xl text-center text-zinc-500">
                            目前暫無即將到達的班次數據
                        </div>
                    `;
                } else {
                    container.innerHTML = busDataList.map(generateRouteHTML).join('');
                }

                // 更新「最後更新時間」文本
                const now = new Date();
                const timeString = now.toTimeString().split(' ')[0];
                document.getElementById('last-update-text').innerText = `最後更新 Last Updated: ${timeString}`;

                // 重置頂部的進度條動畫
                const progressBar = document.getElementById('refresh-progress');
                progressBar.style.animation = 'none';
                progressBar.offsetHeight; // 觸發 reflow 重新繪製
                progressBar.style.animation = 'progress 30s linear infinite';

            } catch (error) {
                console.error("獲取巴士數據失敗:", error);
                document.getElementById('eta-container').innerHTML = `
                    <div class="p-6 bg-red-900/20 border border-red-500 rounded-xl text-center">
                        <p class="text-red-500 text-xl font-bold">無法獲取數據</p>
                        <p class="text-red-400 mt-2 text-sm">請檢查網絡連線或 API 狀態</p>
                    </div>
                `;
            }
        }

        // ---------------------------------------------------------
        // 3. 啟動與自動更新 (30秒)
        // ---------------------------------------------------------
        fetchBusData(); // 初次載入數據
        
        // 設定每 30 秒 (30000 毫秒) 執行一次 fetchBusData
        setInterval(fetchBusData, 30000);

    </script>
</body>
</html>
